<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sneeze Tone App</title>
		<style>
			body {
				margin: 0;
				font-family: Arial, sans-serif;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				background: linear-gradient(135deg, #74ebd5, #acb6e5);
				color: #333;
				text-align: center;
			}
			.container {
				background: #fff;
				padding: 2rem;
				border-radius: 1rem;
				box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
				max-width: 400px;
				width: 90%;
			}
			h1 {
				font-size: 1.8rem;
				margin-bottom: 1rem;
				color: #4a90e2;
			}
			button {
				background: #4a90e2;
				color: white;
				border: none;
				padding: 0.8rem 1.5rem;
				font-size: 1rem;
				border-radius: 0.5rem;
				cursor: pointer;
				transition: background 0.3s ease;
			}
			button:hover {
				background: #357abd;
			}
			.status {
				margin-top: 1.5rem;
				font-size: 1rem;
				color: #666;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>😷 Sneeze Tone App 🎵</h1>
			<button id="start">Start Listening</button>
			<p class="status" id="status">
				Click "Start Listening" and sneeze! 🤧
			</p>
		</div>

		<!-- Replace tone.mp3 with your own sound file -->
		<audio id="tone" src="assets/media/tone.mp3" preload="auto"></audio>

		<script>
			const startBtn = document.getElementById('start');
			const tone = document.getElementById('tone');
			const statusText = document.getElementById('status');

			startBtn.onclick = async () => {
				try {
					const stream = await navigator.mediaDevices.getUserMedia({
						audio: true,
					});
					const audioCtx = new AudioContext();
					const source = audioCtx.createMediaStreamSource(stream);
					const analyser = audioCtx.createAnalyser();
					analyser.fftSize = 512;
					const dataArray = new Uint8Array(analyser.fftSize);

					source.connect(analyser);
					statusText.textContent = 'Listening for sneezes... 🤔';

					function detectLoudSound() {
						analyser.getByteTimeDomainData(dataArray);

						let sum = 0;
						for (let i = 0; i < dataArray.length; i++) {
							const val = (dataArray[i] - 128) / 128;
							sum += val * val;
						}
						const rms = Math.sqrt(sum / dataArray.length);

						if (rms > 0.2) {
							// adjust threshold as needed
							if (tone.paused) {
								tone.currentTime = 0;
								tone.play();
								statusText.textContent =
									'🤧 Sneeze detected! Playing tone 🎶';
								setTimeout(() => {
									statusText.textContent =
										'Listening for sneezes... 🤔';
								}, 2000);
							}
						}

						requestAnimationFrame(detectLoudSound);
					}

					detectLoudSound();
				} catch (err) {
					console.error(err);
					statusText.textContent = 'Microphone access denied 😢';
				}
			};
		</script>
	</body>
</html>
